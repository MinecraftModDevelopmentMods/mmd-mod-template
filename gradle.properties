# Project
mod_version = 1.0.0
mod_name = MMD Mod Template
mod_id = mmdmodtemplate
mod_archive_name = mmd-mod-template
mod_description = A template for modding at MMD.
mod_group = com.mcmoddev.mmdmodtemplate
mod_authors = Minecraft Mod Development
mod_license = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/MMD-Mod-Template/refs/heads/1.10/LICENSE.md
curseforge_id = 000000
update_url = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/MMD-Mod-Template/refs/heads/1.10/update.json

# Common
minecraft_version = 1.10.2
forge_version = 12.18.3.2511
# For old MC versions it can be stable or snapshot while using MCP
mappings_channel = stable
# The version we use, versions can be found at either of these two places depending on if you are using stable or snapshot:
# https://maven.minecraftforge.net/releases/de/oceanlabs/mcp/mcp_stable/maven-metadata.xml
# https://maven.minecraftforge.net/releases/de/oceanlabs/mcp/mcp_snapshot/maven-metadata.xml
# However in 1.16 and above you should want to use parchment, then later on official mojang mappings
mappings_version = 29-1.10.2

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.debug = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = true
