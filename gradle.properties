# Project
# Version string only used in dev, however when making a tag on github it should be like major.minor.bug.mc+loader
# Example: 1.0.0. 1 21 01 2 notice the minecraft version hidden there at the end?
# and the 2 means it's for NeoForge while 1 is Forge and I suspect if we did Fabric mods 3 would be for that.
# (This also helps for bug reports as the version number gives us a clue as to what version of Minecraft the bug happened on)
mod_version = 1.0.0.121012
mod_name = MMD Mod Template
mod_id = mmdmodtemplate
mod_archive_name = mmd-mod-template
mod_description = A template for modding at MMD.
mod_group = zone.moddev.mc.mmdmodtemplate
mod_authors = Minecraft Mod Development
mod_license = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/mmd-mod-template/refs/heads/1.21.1/LICENSE.md
curseforge_id = 238065
update_url = https://raw.githubusercontent.com/MinecraftModDevelopmentMods/mmd-mod-template/refs/heads/1.21.1/update.json
issue_url = https://github.com/MinecraftModDevelopmentMods/mmd-mod-template/issues

# Dependencies
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
neoforge_version = 21.1.265
neoforge_version_range = [21.1,)

# Parchment (parameter names + javadocs on top of Mojang mappings)
# Versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version = 1.21.1
parchment_mappings_version = 2024.11.17

# Gradle
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.parallel = false
