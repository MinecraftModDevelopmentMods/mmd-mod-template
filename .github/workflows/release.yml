name: Upload Release Artifacts

on:
  push:
    tags: [ '*' ]

env:
  JAVA_VERSION: 17
  MAVEN_UPLOAD_URL: ${{ secrets.MAVEN_UPLOAD_URL }}
  MAVEN_UPLOAD_USERNAME: ${{ secrets.MAVEN_UPLOAD_USERNAME }}
  MAVEN_UPLOAD_PASSWORD: ${{ secrets.MAVEN_UPLOAD_PASSWORD }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  TAG: ${{ github.ref_name }}

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for mc-publish to create a GitHub release.


    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assemble

      - name: Maven Release
        run: ./gradlew publish
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish to GitHub
        uses: Kira-NT/mc-publish@v3.3.1
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          files: build/libs/*.jar

      # For additional properties and values that are not detected/set up here you can read up on the docs here:
      # https://github.com/Kira-NT/mc-publish
      # I HEAVILY advise you do so as this action can do a lot but also has a few quirks and doesn't play the best
      # with older pre-mods.toml versions of Minecraft.
      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        continue-on-error: true
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          # The unique CurseForge project ID for this mod.
          curseforge-id: 238065
          files: build/libs/*.jar
          loaders: |
            forge
          environment: client | server
          java: ${{ env.JAVA_VERSION }}
